[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "epl-analyst"
version = "0.1.0"
description = "EPL 2026/27 batch analytics data platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "luigi>=3.6,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.1,<2",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires the local PostgreSQL service",
    "real_api: requires explicit opt-in and live provider credentials",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
exclude = ["research/discovery"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
